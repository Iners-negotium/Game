<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Играть — РФ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">⬡ РФ</a>
  <ul class="nav-links">
    <li><a href="index.html">Главная</a></li>
    <li><a href="characters.html">Персонажи</a></li>
    <li><a href="play.html" class="active">Играть</a></li>

</nav>

<main>
  <div class="page-header">
    <h1>Играть</h1>
    <p>Счётчик БН и случайный врождённый навык</p>
  </div>

  <!-- БН COUNTER -->
  <div class="bn-wrap">
    <div class="bn-card">
      <div class="bn-label">Баллы Надежды</div>
      <div class="bn-number" id="bnVal">10</div>
      <div class="bn-sub">из 20</div>
      <div class="bn-bar-bg">
        <div class="bn-bar-fill" id="bnBar"></div>
      </div>
      <div class="bn-btns">
        <button class="bn-btn m" onclick="changeBN(-3)">−3</button>
        <button class="bn-btn m" onclick="changeBN(-2)">−2</button>
        <button class="bn-btn m" onclick="changeBN(-1)">−1</button>
        <button class="bn-btn p" onclick="changeBN(1)">+1</button>
        <button class="bn-btn p" onclick="changeBN(2)">+2</button>
        <button class="bn-btn p" onclick="changeBN(3)">+3</button>
        <button class="bn-btn p" onclick="changeBN(5)">+5</button>
      </div>
      <button class="bn-reset" onclick="resetBN()">сбросить до 10</button>
      <div class="bn-status" id="bnStatus"></div>
    </div>
  </div>

  <hr class="divider">

  <!-- NAVYK DRAW -->
  <div class="navyk-wrap">
    <div class="page-header" style="text-align:center; margin-bottom:1.25rem;">
      <h2 style="font-size:1.3rem; font-weight:800;">Врождённый навык</h2>
      <p>Каждый игрок тянет 1 карту в начале партии</p>
    </div>

    <div class="navyk-card" id="navykCard">
      <div class="navyk-empty">Нажми кнопку чтобы вытянуть навык</div>
    </div>

    <button class="btn btn-primary btn-full btn-lg" onclick="drawNavyk()">Вытянуть навык</button>
  </div>
</main>

<footer>Ретикулярная Формация · Версия 0.1</footer>

<script>
// ─── БН ───────────────────────────────────────────────
let bn = 10;

function updateBN() {
  const val  = document.getElementById('bnVal');
  const bar  = document.getElementById('bnBar');
  const stat = document.getElementById('bnStatus');

  val.textContent = bn;

  const pct = (bn / 20) * 100;
  bar.style.width = pct + '%';

  if (bn <= 4)       { bar.style.background = '#dc2626'; val.style.color = '#f87171'; }
  else if (bn <= 9)  { bar.style.background = '#ea580c'; val.style.color = '#fb923c'; }
  else if (bn <= 14) { bar.style.background = '#ca8a04'; val.style.color = '#fbbf24'; }
  else               { bar.style.background = '#059669'; val.style.color = '#34d399'; }

  if (bn >= 20) {
    stat.style.display = 'block';
    stat.style.background = 'rgba(5,150,105,0.15)';
    stat.style.color = '#34d399';
    stat.style.border = '1px solid rgba(5,150,105,0.3)';
    stat.textContent = '🧠 РФ запущена — коматозник просыпается!';
  } else if (bn <= 0) {
    stat.style.display = 'block';
    stat.style.background = 'rgba(220,38,38,0.15)';
    stat.style.color = '#f87171';
    stat.style.border = '1px solid rgba(220,38,38,0.3)';
    stat.textContent = '💀 РФ погасла — коматозник умирает';
  } else {
    stat.style.display = 'none';
  }
}

function changeBN(delta) {
  bn = Math.max(0, Math.min(20, bn + delta));
  updateBN();
}

function resetBN() {
  bn = 10;
  updateBN();
}

updateBN();

let lastIndex = -1;

function drawNavyk() {
  let idx;
  do { idx = Math.floor(Math.random() * navyki.length); } while (idx === lastIndex && navyki.length > 1);
  lastIndex = idx;

  const n = navyki[idx];
  const color = FLAG_COLORS[n.flag] || '#555';
  const card  = document.getElementById('navykCard');

  card.style.borderColor = color;
  card.innerHTML = `
    <div class="navyk-flag">
      <span class="flag" style="background:${color};font-size:0.85rem;padding:0.25rem 0.75rem;">${n.flag}</span>
    </div>
    <div class="navyk-name">${n.name}</div>
    <div class="navyk-flavor">"${n.flavor}"</div>
    <div class="navyk-effects">
      <div class="navyk-effect-row plus">
        <span class="navyk-icon">✦</span>
        <span>${n.plus}</span>
      </div>
      <div class="navyk-effect-row minus">
        <span class="navyk-icon">✧</span>
        <span>${n.minus}</span>
      </div>
    </div>
  `;
}
</script>
