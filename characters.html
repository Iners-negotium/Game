function flagBadge(f) {
  const c = FLAG_COLORS[f] || '#555';
  return `<span class="flag" style="background:${c}">${f}</span>`;
}

function renderChar(ch) {
  const skillsHTML = ch.skills.map(s => `
    <div class="skill-item">
      <div class="skill-name">${s.name}</div>
      <div class="skill-flavor">${s.flavor}</div>
      <div class="skill-effect">${s.effect}</div>
    </div>
  `).join('');

  const setsHTML = ch.sets.length ? ch.sets.map(set => `
    <div class="set-block">
      <div class="set-name">⬡ ${set.name}</div>
      <div class="set-items">
        ${set.items.map(i => `
          <div class="item-row">
            <span class="item-name">${i.name}</span>
            <span class="item-desc">${i.desc}</span>
          </div>
        `).join('')}
      </div>
      <div class="set-bonus">Полный сет → ${set.bonus}</div>
    </div>
  `).join('') : '';

  const goalsHTML = ch.goals.map((g, i) => `
    <div class="goal-item">
      <div class="goal-num">${i+1}</div>
      <div class="goal-text">
        <strong>${g.title}</strong>
        <span>${g.cond}</span>
      </div>
    </div>
  `).join('');

  const id = 'char-' + ch.name.replace(/\s/g,'-');

  return `
    <div class="char-card" data-type="${ch.type}" data-city="${ch.city}">
      <div class="char-header" onclick="toggle('${id}')">
        <div class="char-header-left">
          <div class="char-name">${ch.name}</div>
          <div class="char-city">${ch.city}</div>
          <div class="flags">${ch.flags.map(flagBadge).join('')}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.5rem;">
          <span class="badge ${TYPE_CLASS[ch.type]}">${TYPE_LABELS[ch.type]}</span>
          <button class="char-toggle" id="btn-${id}">▼</button>
        </div>
      </div>
      <div class="char-body" id="${id}">
        ${skillsHTML ? `<div class="section-label">Навыки</div>${skillsHTML}` : ''}
        ${setsHTML   ? `<div class="section-label">Предметы и сеты</div>${setsHTML}` : ''}
        <div class="section-label">Личные цели</div>
        <div class="goal-list">${goalsHTML}</div>
      </div>
    </div>
  `;
}

function toggle(id) {
  const body = document.getElementById(id);
  const btn  = document.getElementById('btn-' + id);
  const open = body.classList.toggle('open');
  btn.textContent = open ? '▲' : '▼';
}

function render(filter) {
  const grid = document.getElementById('charGrid');
  const filtered = filter === 'all' ? characters
    : characters.filter(c => c.type === filter || c.city === filter);
  grid.innerHTML = filtered.map(renderChar).join('');
}

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render(btn.dataset.filter);
});

render('all');
</script>
</body>
</html>
